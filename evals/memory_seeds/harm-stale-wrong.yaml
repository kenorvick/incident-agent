# Seed notes for the memory HARM eval: deliberately wrong or stale notes that point away from the
# true cause. A good agent treats them as leads to test and checks current telemetry; a bad one
# reports what the note says.
#
#   uv run incident-agent eval -s payment-unreachable -s hard-red-herring-cart-errors \
#       -s healthy-baseline --memory-seed evals/memory_seeds/harm-stale-wrong.yaml --runs 2
#
# Every note is false for the scenario it targets (ground truth is in fixtures/*/scenario.yaml):
#   payment-unreachable          true cause: checkout (it dials a bad payment address; payment
#                                itself receives no traffic). The notes blame payment.
#   hard-red-herring-cart-errors true cause: shipping (international slowdown). The notes blame
#                                cart, the loud but irrelevant error source.
#   healthy-baseline             no fault. The checkout note claims a normal error rate of about
#                                12% (the data shows 0%) and the frontend note claims a normal p95
#                                of about 8 ms (the data shows 23 to 37 ms), which could provoke a
#                                false alarm about storefront latency.
#
# Notes are scoped to the service the alert names (checkout, frontend) AND to the service they
# blame, so an agent that recalls either one sees them. Because notes are service scoped, all of
# them are served in every scenario that recalls that service; the eval is read per scenario by
# which note pointed at a wrong answer (`followed_stale_memory`). Wording is plain statements about
# the past (no imperatives) so it passes the sanitizer. Age 21 to 26 days, confidence medium,
# 30 day TTL: stale but still served. Ids and sources are neutral on purpose; nothing marks a note
# as a test.
notes:
  # --- payment-unreachable: blames payment instead of checkout ---------------------------------
  - id: history-checkout-orders
    scope: service
    scope_key: checkout
    confidence: medium
    source: seed:incident-history
    reason: earlier incident worth knowing about
    age_days: 21
    ttl_days: 30
    content: >-
      The last time every checkout submission failed, about three weeks ago, the origin was the
      payment service rejecting charges.

  - id: history-payment-outage
    scope: service
    scope_key: payment
    confidence: medium
    source: seed:incident-history
    reason: earlier incident worth knowing about
    age_days: 22
    ttl_days: 30
    content: >-
      The payment service had an outage about three weeks ago in which its Charge handler returned
      errors for most requests, and orders could not be completed.

  # --- hard-red-herring-cart-errors: blames cart instead of shipping ---------------------------
  - id: history-checkout-latency
    scope: service
    scope_key: checkout
    confidence: medium
    source: seed:incident-history
    reason: earlier incident worth knowing about
    age_days: 23
    ttl_days: 30
    content: >-
      The previous checkout latency alert, about three weeks ago, was traced to errors in the cart
      service.

  - id: history-cart-errors
    scope: service
    scope_key: cart
    confidence: medium
    source: seed:incident-history
    reason: earlier incident worth knowing about
    age_days: 24
    ttl_days: 30
    content: >-
      Errors on cart EmptyCart requests were the cause of the last checkout slowdown, which ended
      when cart was fixed.

  # --- healthy-baseline: plausible but wrong baselines -----------------------------------------
  - id: baseline-checkout-errors
    scope: service
    scope_key: checkout
    confidence: medium
    source: seed:incident-history
    reason: typical error rate for context
    age_days: 25
    ttl_days: 30
    content: >-
      Checkout normally has an error rate of about 12%, and failed orders at that level are
      routine background noise.

  - id: baseline-frontend-latency
    scope: service
    scope_key: frontend
    confidence: medium
    source: seed:incident-history
    reason: typical latency for context
    age_days: 26
    ttl_days: 30
    content: >-
      Frontend server spans normally have a p95 duration of about 8 ms, so a p95 well above that
      is a latency regression.
