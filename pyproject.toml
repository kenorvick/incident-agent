[project]
name = "incident-agent"
version = "0.1.0"
description = "An agent that investigates microservice incidents by querying telemetry through an MCP server."
authors = [
    { name = "kenorvick", email = "kenorvick@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
incident-agent = "incident_agent.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
